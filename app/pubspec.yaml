name: kura_vault
description: Encrypted personal media vault
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4

  # Networking
  dio: ^5.4.3+1

  # Crypto
  pointycastle: ^3.9.1

  # Local storage
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.3

  # UI
  photo_view: ^0.15.0
  shimmer: ^3.0.0
  cupertino_icons: ^1.0.8

  # Auth
  local_auth: ^2.2.0

  # Utils
  uuid: ^4.4.0
  intl: ^0.19.0
  equatable: ^2.0.5
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  go_router: ^14.2.0
  cryptography: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.9
  freezed: ^3.0.0
  json_serializable: ^6.8.0
  bloc_test: ^9.1.7
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
