name: CI

on:
  pull_request:
  push:
    branches: [main]

# No job here holds a secret or can write anything
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: backend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            backend/pnpm-lock.yaml
            migration-cli/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile
        working-directory: backend
      # The crypto tests check the web client against the import CLI's encryptor
      - run: pnpm install --frozen-lockfile
        working-directory: migration-cli
      - run: pnpm typecheck
      - run: pnpm test
      # The server's rules against a real backend and a throwaway PostgreSQL
      - run: pnpm test:api

  # Builds both images as a release would, scans them, and runs the published
  # deploy/ bundle with them: the whole path a self-hoster takes, through the web
  # container, including uploads to the bundled Garage on pre-signed URLs.
  images:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build server image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          target: production
          load: true
          tags: kura-vault-server:ci
          build-args: APP_VERSION=ci-${{ github.sha }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max
      - name: Build web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: web
          load: true
          tags: kura-vault-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Scan server image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kura-vault-server:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan web image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kura-vault-web:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web

      - name: Start the deploy bundle
        working-directory: deploy
        run: |
          setup_key=$(openssl rand -base64 33 | tr -d '\n' | tr '+/' '-_')
          echo "SETUP_KEY=$setup_key" >> "$GITHUB_ENV"
          sed \
            -e "s|^KURA_VERSION=.*|KURA_VERSION=ci\nKURA_SERVER_IMAGE=kura-vault-server\nKURA_WEB_IMAGE=kura-vault-web|" \
            -e "s|^PUBLIC_URL=.*|PUBLIC_URL=http://localhost:8080|" \
            -e "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(openssl rand -hex 24)|" \
            -e "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -hex 32)|" \
            -e "s|^SETUP_KEY=.*|SETUP_KEY=$setup_key|" \
            -e "s|^AWS_ACCESS_KEY_ID=CHANGE_ME|AWS_ACCESS_KEY_ID=GK$(openssl rand -hex 12)|" \
            -e "s|^AWS_SECRET_ACCESS_KEY=CHANGE_ME|AWS_SECRET_ACCESS_KEY=$(openssl rand -hex 32)|" \
            -e "s|^GARAGE_RPC_SECRET=.*|GARAGE_RPC_SECRET=$(openssl rand -hex 32)|" \
            example.env > .env
          docker compose up -d --wait --wait-timeout 180

      - name: Smoke test through the web container
        working-directory: web
        env:
          E2E_API_URL: http://localhost:8080/api/v1
        run: pnpm exec tsx tests/deploy/smoke.ts

      - name: Server keeps working after it is recreated (an upgrade)
        working-directory: deploy
        run: |
          docker compose up -d --wait --force-recreate --no-deps server
          curl -fsS http://localhost:8080/api/v1/health

      # Only once the bundle was started: without its .env, compose refuses to run
      - name: Logs
        if: always()
        working-directory: deploy
        run: |
          [ -f .env ] || { echo "The deploy bundle was not started"; exit 0; }
          docker compose logs --no-color

  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: shellcheck -s sh deploy/install.sh deploy/upgrade.sh web/docker-entrypoint.d/40-kura-config.sh scripts/release.sh

  site:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm validate
      - run: pnpm links
