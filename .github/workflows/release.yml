name: Release images

# Only releases publish: a tag v1.2.3 publishes 1.2.3, 1.2, 1 and latest (a
# prerelease such as v1.3.0-rc.1 only its own tag), and attaches the deploy
# bundle to the GitHub Release. Pushes to main publish nothing; CI builds and
# tests the images there. Images go to GHCR and, when the DOCKERHUB_NAMESPACE
# variable is set, to Docker Hub too: the same digest, built natively for amd64
# and arm64. Each one is a multi-arch index and its two platform images, with no
# attestations or signatures beside them, so a release adds three package
# versions per image.
#
# Docker Hub needs: repository variable DOCKERHUB_NAMESPACE, secrets
# DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (an access token with read/write scope).

on:
  push:
    tags: ['v*.*.*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GHCR_NAMESPACE: ghcr.io/greytimelabs
  DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        image: [server, web]
        platform: [linux/amd64, linux/arm64]
        include:
          - image: server
            context: backend
            target: production
          - image: web
            context: web
            target: ''
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A tag must name the version the code carries (scripts/release.sh sets both)
      - name: Check the tag matches the code
        run: |
          want="${GITHUB_REF_NAME#v}"
          bad=0
          for pkg in backend/package.json web/package.json migration-cli/package.json; do
            have=$(jq -r .version "$pkg")
            [ "$have" = "$want" ] || { echo "::error file=$pkg::version is $have, tag is $GITHUB_REF_NAME"; bad=1; }
          done
          have=$(sed -nE 's/^version: *([^+ ]*).*/\1/p' app/pubspec.yaml)
          [ "$have" = "$want" ] || { echo "::error file=app/pubspec.yaml::version is $have, tag is $GITHUB_REF_NAME"; bad=1; }
          exit $bad

      - name: Version
        id: version
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          names="${GHCR_NAMESPACE}/kura-vault-${{ matrix.image }}"
          [ -n "$DOCKERHUB_NAMESPACE" ] && names="$names,docker.io/${DOCKERHUB_NAMESPACE}/kura-vault-${{ matrix.image }}"
          echo "names=$names" >> "$GITHUB_OUTPUT"
          echo "platform-slug=${{ matrix.platform }}" | tr '/' '-' >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: env.DOCKERHUB_NAMESPACE != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            VCS_REF=${{ github.sha }}
          outputs: type=image,"name=${{ steps.version.outputs.names }}",push-by-digest=true,name-canonical=true,push=true
          # Attestations would wrap each platform image in its own index and add
          # more manifests beside it; a release pushes only the images
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.image }}-${{ steps.version.outputs.platform-slug }}
          cache-to: type=gha,scope=${{ matrix.image }}-${{ steps.version.outputs.platform-slug }},mode=max

      - name: Keep the digest
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.image }}-${{ steps.version.outputs.platform-slug }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        image: [server, web]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true

      - name: Image names
        id: names
        run: |
          {
            echo "images<<EOF"
            echo "${GHCR_NAMESPACE}/kura-vault-${{ matrix.image }}"
            [ -n "$DOCKERHUB_NAMESPACE" ] && echo "docker.io/${DOCKERHUB_NAMESPACE}/kura-vault-${{ matrix.image }}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ steps.names.outputs.images }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: env.DOCKERHUB_NAMESPACE != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create the multi-platform tags
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGES: ${{ steps.names.outputs.images }}
          META_JSON: ${{ steps.meta.outputs.json }}
        run: |
          for image in $IMAGES; do
            tags=$(jq -r --arg image "$image" '.tags[] | select(startswith($image + ":")) | "-t " + .' <<< "$META_JSON")
            # shellcheck disable=SC2046,SC2086
            docker buildx imagetools create $tags $(printf "$image@sha256:%s " *)
          done

  bundle:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the release and attach files
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare the deploy bundle
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp deploy/docker-compose.yml deploy/garage.toml deploy/install.sh dist/
          # The bundle names its own release, so a download is pinned from the start
          sed "s|^KURA_VERSION=.*|KURA_VERSION=$version|" deploy/example.env > dist/example.env
          (cd dist && sha256sum docker-compose.yml example.env garage.toml install.sh > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: Attach to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            # shellcheck disable=SC2086
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes $prerelease --repo "$GITHUB_REPOSITORY"
          fi
