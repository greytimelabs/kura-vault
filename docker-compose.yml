# Development database. To deploy a server, use deploy/docker-compose.yml (docs/self-hosting.md).
services:
  postgres:
    image: postgres:17-alpine
    container_name: kuravault-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kuravault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kuravault_dev}
      POSTGRES_DB: ${POSTGRES_DB:-kuravault}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kuravault} -d ${POSTGRES_DB:-kuravault}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kuravault-net
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /run/postgresql

volumes:
  pgdata:
    driver: local

networks:
  kuravault-net:
    driver: bridge
