# Serves the built web client and proxies the API on the same origin, so the
# refresh cookie (SameSite=Strict) works and the API needs no CORS for the web.
# With the bundled Garage it also proxies the bucket, so pre-signed URLs point at
# this same origin and the policy's connect-src stays 'self'.
#
# Rendered at start by the image's entrypoint: ${API_UPSTREAM} and the resolver here, and the
# kura-*.inc snippets by /docker-entrypoint.d/40-kura-config.sh from S3_ORIGIN,
# S3_PROXY_UPSTREAM, S3_BUCKET_NAME and TRUSTED_PROXIES. See docs/self-hosting.md.

# The scheme the user reached the outer proxy on, when one says so
map $http_x_forwarded_proto $kura_forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 8080;
  server_name _;
  server_tokens off;

  # Look upstreams up at request time, not once at start: a recreated server or
  # garage container (an upgrade) gets a new address
  resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
  set $kura_api ${API_UPSTREAM};
  root /usr/share/nginx/html;
  index index.html;

  # Client address from a trusted reverse proxy in front (set_real_ip_from lines)
  include /etc/nginx/conf.d/kura-realip.inc;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  # nginx drops server-level add_header lines in any location that adds its own,
  # so every location includes the security headers itself
  include /etc/nginx/conf.d/kura-headers.inc;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location /api/ {
    include /etc/nginx/conf.d/kura-headers.inc;
    # These come from this proxy; the API's own copies would be duplicates
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Cross-Origin-Opener-Policy;
    proxy_pass $kura_api;
    proxy_set_header Host $host;
    # After real_ip, $remote_addr is the client: the API trusts exactly this one hop
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $kura_forwarded_proto;
  }

  # The bucket, when it is served from this origin (empty otherwise)
  include /etc/nginx/conf.d/kura-storage.inc;

  # Hashed build output never changes
  location /assets/ {
    include /etc/nginx/conf.d/kura-headers.inc;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # The app shell must always be fresh; routes are resolved in the browser
  location / {
    include /etc/nginx/conf.d/kura-headers.inc;
    add_header Cache-Control "no-store";
    try_files $uri /index.html;
  }
}
