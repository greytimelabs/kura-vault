# Serves the built web client and proxies the API on the same origin, so the
# refresh cookie (SameSite=Strict) works and the API needs no CORS for the web.
# Set API_UPSTREAM (e.g. http://backend:3000) and S3_ORIGIN (the bucket's exact
# origin, e.g. https://kura-vault-storage.s3.ap-south-1.amazonaws.com, or for
# Cloudflare R2 https://<account-id>.r2.cloudflarestorage.com) at run time.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src blob:; connect-src 'self' ${S3_ORIGIN}; worker-src 'self' blob:; font-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  location /api/ {
    proxy_pass ${API_UPSTREAM};
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hashed build output never changes
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # The app shell must always be fresh; routes are resolved in the browser
  location / {
    add_header Cache-Control "no-store";
    try_files $uri /index.html;
  }
}
