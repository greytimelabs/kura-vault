# Bundled object storage for Kura Vault: one Garage node, no replication.
# Keep a backup of the media volume: a single node has no redundancy.
# The RPC secret, access key and bucket come from the environment (docker-compose.yml).
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
# Must equal AWS_REGION in .env
s3_region = "garage"
api_bind_addr = "[::]:3900"
